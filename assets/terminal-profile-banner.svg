<svg width="1100" height="480" viewBox="0 0 1100 480" xmlns="http://www.w3.org/2000/svg" font-family="'Fira Code','JetBrains Mono',monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e14"/>
      <stop offset="100%" stop-color="#0d1420"/>
    </linearGradient>
    <linearGradient id="glowLeft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00fff2" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#00fff2" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#00fff2" stop-opacity="0.15"/>
    </linearGradient>
    <style>
      .title   { fill:#5c8a99; font-size:13px; }
      .label   { fill:#4fd1c5; font-size:14px; font-weight:600; }
      .value   { fill:#9fe8ff; font-size:14px; }
      .section { fill:#00e0c0; font-size:13px; font-weight:700; letter-spacing:1px; }
      .dim     { fill:#3a5560; font-size:13px; }
      .link    { fill:#00fff2; font-size:13px; font-weight:600; }
      .footer  { fill:#39707a; font-size:12px; letter-spacing:2px; }
      @keyframes blink { 0%,49%{opacity:1;} 50%,100%{opacity:0;} }
      .cursor { animation: blink 1s step-start infinite; fill:#00fff2; }
      @keyframes scan {
        0%   { transform: translateY(-480px); }
        100% { transform: translateY(480px); }
      }
      .scanline { animation: scan 4s linear infinite; }
    </style>
  </defs>

  <!-- outer frame -->
  <rect x="4" y="4" width="1092" height="472" rx="14" fill="url(#bg)" stroke="#00fff2" stroke-opacity="0.5" stroke-width="1.5"/>

