  <circle cx="1055" cy="32" r="5" fill="#ff4d4d"/>
  <text x="1035" y="37" text-anchor="end" class="dim" fill="#ff8080">SCANNING</text>

  <line x1="4" y1="56" x2="1096" y2="56" stroke="#00fff2" stroke-opacity="0.2"/>

  <!-- left panel -->
  <rect x="24" y="76" width="500" height="380" rx="8" fill="url(#glowLeft)" stroke="#00fff2" stroke-opacity="0.2"/>
  <text x="44" y="102" class="dim">VISUAL.MAP / PORTRAIT.SIGNAL</text>

